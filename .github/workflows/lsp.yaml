name: Zig Analyzer LSP CI

on:
  push:
    branches: [main]
    paths:
      - "**/*.zig"
      - "build.zig.zon"
      - ".github/workflows/lsp.yaml"
  pull_request:
    paths:
      - "**/*.zig"
      - "build.zig.zon"
      - ".github/workflows/lsp.yaml"

concurrency:
  group: lsp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
      - name: Setup Zig
        uses: jassielof/setup-zig@main
      - name: Build
        run: zig build
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Zig
        uses: jassielof/setup-zig@main
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
      - name: Test suite
        run: zig build test --summary all
