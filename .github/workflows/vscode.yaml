name: VS Code CI

on:
  push:
    branches: [main]
    paths:
      - "src/vscode/**"
      - "package.json"
      - "esbuild.config.js"
      - "eslint.config.js"
      - "syntaxes/**"
      - "tsconfig.json"
      - "language-configuration.json"
      - ".github/workflows/vscode.yaml"
  pull_request:
    paths:
      - "src/vscode/**"
      - "package.json"
      - "esbuild.config.js"
      - "eslint.config.js"
      - "syntaxes/**"
      - "tsconfig.json"
      - "language-configuration.json"
      - ".github/workflows/vscode.yaml"

concurrency:
  group: vscode-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: vscode

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: Setup PNPM
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          cache: pnpm
          cache-dependency-path: vscode/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Package
        run: pnpm run package
